name: Something is broken
description: A tool doesn't do what its README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't paste secrets, tokens, or private paths and names. Replace them with placeholders."
  - type: input
    id: tool
    attributes: { label: Which tool?, placeholder: hooks/bash-guard }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What did you run, what did you expect, what happened? }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: "OS, shell, Claude Code version", placeholder: "macOS 26, zsh, Claude Code 2.x" }
